<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>天气日历 · Weather Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <div class="grid-overlay"></div>
  </div>

  <div class="app">
    <header class="app-header glass">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>WEATHER<span>//</span>CALENDAR</h1>
      </div>
      <div class="header-sub">实时天气与智能日历</div>
    </header>

    <section class="weather-panel glass">
      <form id="search-form" class="search-form">
        <div class="search-field">
          <span class="search-icon">◎</span>
          <input id="city-input" type="text" placeholder="搜索城市 e.g. Seoul / Shanghai" autocomplete="off" />
        </div>
        <button type="submit" class="ghost-btn">搜索</button>
        <button type="button" id="locate-btn" class="ghost-btn locate-btn">
          <span class="locate-icon">◈</span> 定位
        </button>
      </form>

      <div id="weather-display" class="weather-display is-loading">
        <div class="weather-skeleton">
          <div class="sk-icon"></div>
          <div class="sk-lines">
            <div class="sk-line sk-line-lg"></div>
            <div class="sk-line sk-line-sm"></div>
          </div>
        </div>

        <div class="weather-content" hidden>
          <div class="weather-icon" id="cw-icon"></div>
          <div class="weather-main">
            <div class="weather-temp" id="cw-temp"></div>
            <div class="weather-desc" id="cw-desc"></div>
            <div class="weather-place" id="cw-place"></div>
          </div>
          <div class="weather-meta">
            <div><span class="meta-label">风速</span><span id="cw-wind">--</span> km/h</div>
            <div><span class="meta-label">更新</span><span id="cw-updated">--</span></div>
          </div>
        </div>

        <div class="weather-error" id="weather-error" hidden></div>
      </div>
    </section>

    <section class="hourly-panel glass">
      <div class="hourly-panel-header">
        <span class="panel-eyebrow">HOURLY</span>
        <h3>24 小时预报</h3>
      </div>
      <div class="hourly-scroll" id="hourly-scroll">
        <div class="hourly-empty" id="hourly-empty">暂无逐时数据</div>
      </div>
    </section>

    <nav class="calendar-controls glass">
      <button id="prev-month" class="nav-btn" aria-label="上个月">
        <span class="chevron">‹</span>
      </button>
      <div class="month-display">
        <span id="month-label" class="month-label"></span>
        <span id="year-label" class="year-label"></span>
      </div>
      <button id="next-month" class="nav-btn" aria-label="下个月">
        <span class="chevron">›</span>
      </button>
      <button id="today-btn" class="today-btn">TODAY</button>
    </nav>

    <main class="calendar-wrapper glass">
      <div class="calendar-grid weekday-row" id="weekday-row"></div>
      <div class="calendar-grid-viewport">
        <div class="calendar-grid month-grid" id="calendar-grid"></div>
      </div>
    </main>

    <footer class="app-footer">
      <span class="status-pill">
        <span class="status-dot"></span>
        数据来源 Open-Meteo · 历史 31 天 + 预报 16 天
      </span>
    </footer>
  </div>

  <div class="modal-overlay" id="day-modal-overlay" hidden>
    <div class="day-modal glass" role="dialog" aria-modal="true" aria-labelledby="dm-date">
      <button type="button" class="modal-close" id="day-modal-close" aria-label="关闭">✕</button>

      <div class="day-modal-header">
        <div class="day-modal-icon" id="dm-icon"></div>
        <div>
          <div class="day-modal-date" id="dm-date"></div>
          <div class="day-modal-desc" id="dm-desc"></div>
        </div>
      </div>

      <div class="day-modal-temp" id="dm-temp"></div>

      <div class="day-modal-stats">
        <div class="stat-tile">
          <div class="stat-icon">💧</div>
          <div class="stat-label">湿度</div>
          <div class="stat-value" id="dm-humidity">--</div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">🌬️</div>
          <div class="stat-label">风速</div>
          <div class="stat-value" id="dm-wind">--</div>
        </div>
        <div class="stat-tile">
          <div class="stat-icon">🌧️</div>
          <div class="stat-label">降水量</div>
          <div class="stat-value" id="dm-precip">--</div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
